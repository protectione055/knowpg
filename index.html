<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f5">
  <meta name="description" content="PostgreSQL 18.6 内核熟悉度自测：36 道单选题，覆盖查询规划、执行器、堆表与缓冲、索引、事务并发和 WAL 恢复。">
  <title>How Well Do You Know PostgreSQL?</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('pg-kernel-assessment.theme')
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        const lang = localStorage.getItem('pg-kernel-assessment.lang')
        if (lang === 'en') document.documentElement.lang = 'en'
      } catch {}
    })()
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到主要内容</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#home">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5.5 14.5c-1.4-1.2-2-3.2-1.7-5.5C4.2 5.9 6.6 4 10 4c2.8 0 4.8 1.2 5.8 3.2 1.8-.3 3.7.7 4 2.8.3 2.1-.6 4.7-2 5.4-1 .5-1.8-.2-1.8-1.4v-2.1"/>
            <path d="M14.5 12.2v5.3c0 1.4-.9 2.5-2.1 2.5s-2.1-1-2.1-2.3v-1.2"/>
            <path d="M9.6 15.8c-1.8.4-3.4-.2-4.1-1.3"/>
            <circle cx="11.2" cy="8.5" r="0.9" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="brand-name">PG Internals</span>
      </a>
      <div class="header-right">
        <nav aria-label="主导航">
          <a href="#home" data-nav="home">首页</a>
          <a href="#history" data-nav="history">历史报告</a>
        </nav>
        <div class="header-controls">
          <button type="button" class="icon-btn lang-toggle" id="lang-toggle" aria-label="Switch to English" title="Switch to English">EN</button>
          <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="切换浅色/深色主题" title="切换浅色/深色主题">
            <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1"></main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>PostgreSQL 18.6</span>
      <span id="footer-right">数据仅存于当前浏览器</span>
    </div>
  </footer>
  <dialog id="confirmation" aria-labelledby="confirm-title">
    <h2 id="confirm-title">确认交卷</h2>
    <p id="confirm-copy"></p>
    <form method="dialog" class="dialog-actions">
      <button class="button button-secondary" id="confirm-cancel" value="cancel" autofocus>返回检查</button>
      <button class="button button-primary" id="confirm-submit" value="submit">确认交卷</button>
    </form>
  </dialog>
</body>
</html>
